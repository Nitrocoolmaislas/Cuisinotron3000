name: CuisineAZ Catalog Scrape

on:
  schedule:
    - cron: '0 7 * * 0'   # Dimanche 7h UTC (2h après Marmiton, 1h après 750g)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Scrape cuisineaz.com
        run: python cuisineaz_scraper.py --output data/cuisineaz_catalog.json --per-query 5 --delay 3.0

      - uses: EndBug/add-and-commit@v9
        with:
          message: 'chore(data): update cuisineaz_catalog.json [skip ci]'
          add: data/cuisineaz_catalog.json
          default_author: github_actions
