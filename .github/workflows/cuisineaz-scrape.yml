name: CuisineAZ Catalog Scrape

on:
  schedule:
    - cron: '0 7 * * 0'   # Dimanche 7h UTC (2h après Marmiton, 1h après 750g)
  workflow_dispatch:
    inputs:
      mode:
        description: 'scrape (normal) ou discover (diagnostic robots.txt/sitemap/page d''accueil dans les logs, ne commit rien)'
        type: choice
        options: [scrape, discover]
        default: scrape

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Discover cuisineaz.com structure
        if: github.event.inputs.mode == 'discover'
        run: python cuisineaz_scraper.py --discover

      - name: Scrape cuisineaz.com
        if: github.event.inputs.mode != 'discover'
        run: python cuisineaz_scraper.py --output data/cuisineaz_catalog.json --per-query 8 --delay 3.0

      - uses: EndBug/add-and-commit@v9
        if: github.event.inputs.mode != 'discover'
        with:
          message: 'chore(data): update cuisineaz_catalog.json [skip ci]'
          add: data/cuisineaz_catalog.json
          default_author: github_actions
